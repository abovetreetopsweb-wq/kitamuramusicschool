<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="./img/common/logo.svg" type="image/svg+xml">
    <title>お問い合わせ | きたむらミュージックスクール</title>
    <meta name="description" content="きたむらミュージックスクールは、音楽で生きることを目指す方のための音楽スクールです。充実したレッスンとサポートで、一人ひとりの夢や目標の実現を支えます。">
    <!--ogp-->
    <meta property="og:title" content="お問い合わせ | きたむらミュージックスクール">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://test.abovetreetops.com/site-5/img/common/ogp.jpg">
    <meta property="og:url" content="https://test.abovetreetops.com/site-5/contact-form.html">
    <meta property="og:description"
        content="きたむらミュージックスクールは、音楽で生きることを目指す方のための音楽スクールです。充実したレッスンとサポートで、一人ひとりの夢や目標の実現を支えます。">
    <meta property="og:site_name" content="きたむらミュージックスクール">
    <meta property="og:locale" content="ja_JP">
    <!--css-->
    <link rel="stylesheet" href="./css/style.css?v=1400">
</head>

<body>
    <div id="container">
        <!-- #region header -->
        <header class="l-header p-header">
            <div class="p-header__inner">
                <div class="p-header__logo">
                    <h1>
                        <a href="./index.html">
                            <span class="p-header__logo-image">
                                <img src="./img/common/logo.svg" alt="きたむらミュージックスクール">
                            </span>
                            <span class="p-header__logo-title">
                                <span>きたむら</span><span>ミュージックスクール</span>
                            </span>
                        </a>
                    </h1>
                </div>
                <!--ハンバーガー-->
                <div class="p-header__hb-btn">
                    <div class="p-header__hb-inner">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                </div>
                <nav class="p-header__nav">
                    <ul>
                        <li><a href="./plan.html">料金</a></li>
                        <li><a href="./blog-list.html">ブログ</a></li>
                        <li><a href="./result-list.html">卒業実績</a></li>
                    </ul>
                    <div class="p-header__button">
                        <div class="c-button p-header__button-inner">
                            <a href="./contact-form.html">
                                お問い合わせ
                            </a>
                        </div>
                    </div>
                </nav>
            </div>
        </header>
        <!-- #endregion header -->

        <main class="p-contact">
            <!--下層MV-->
            <div class="p-page-visual">
                <div class="p-page-visual__image">
                    <picture>
                        <source media="(max-width: 767px)" srcset="./img/contact_form/contact_sp.jpg">
                        <!-- 見出しの背景として使う装飾画像なので、altは空 -->
                        <img src="./img/contact_form/contact.jpg" alt="">
                    </picture>
                </div>
                <h2 class="p-page-visual__title">お問い合わせ</h2>
            </div>

            <!--パンくず-->
            <nav class="p-breadcrumb">
                <div class="c-inner">
                    <ul class="p-breadcrumb__list">
                        <li class="p-breadcrumb__item"><a href="./index.html">ホーム</a></li>
                        <li class="p-breadcrumb__item">お問い合わせ</li>
                    </ul>
                </div>
            </nav>

            <!-- #region section contact -->
            <div class="p-contact__container">
                <div class="c-inner">
                    <div class="p-contact__contents">
                        <p class="p-contact__intro">当校に関するご質問・ご相談・資料請求は下記のフォームからお気軽にお問い合わせください。<br>
                            通常３営業日以内にメールにてご連絡させていただきます。</p>
                        <div class="p-contact__form">
                            <form action="contact-send.html">
                                <dl>
                                    <dt class="flex-center">
                                        <label for="company">会社名</label>
                                    </dt>
                                    <dd>
                                        <input type="text" name="company" id="company" class="form-control"
                                            placeholder="きたむらミュージックスクール">
                                    </dd>
                                </dl>
                                <dl class="form-space">
                                    <dt class="flex-center">
                                        <label for="name">お名前</label>
                                    </dt>
                                    <dd>
                                        <input type="text" name="name" id="name" class="form-control"
                                            placeholder="北村　翔平">
                                    </dd>
                                </dl>
                                <dl class="form-space">
                                    <dt class="flex-center">
                                        <label for="email">メールアドレス</label>
                                    </dt>
                                    <dd>
                                        <input type="email" name="email" id="email" class="form-control"
                                            placeholder="info@kitamura.musicschool.jp">
                                    </dd>
                                </dl>
                                <dl class="form-space">
                                    <dt class="flex-center">
                                        <label for="tel">電話番号</label>
                                    </dt>
                                    <dd>
                                        <input type="tel" name="tel" id="tel" class="form-control"
                                            placeholder="090-1234-5678">
                                    </dd>
                                </dl>
                                <dl class="form__checkbox">
                                    <dt>
                                        <span>目　的　<br class="pc">(複数選択可)</span>
                                    </dt>
                                    <dd class="p-contact__check">
                                        <label class="p-contact__check-item">
                                            <input type="checkbox" name="purpose" value="plan">
                                            <span>プランについてのお問い合わせ</span>
                                        </label>
                                        <label class="p-contact__check-item">
                                            <input type="checkbox" name="purpose" value="hearing">
                                            <span>ヒアリングのご予約</span>
                                        </label>
                                        <label class="p-contact__check-item">
                                            <input type="checkbox" name="purpose" value="document">
                                            <span>資料請求</span>
                                        </label>
                                        <label class="p-contact__check-item">
                                            <input type="checkbox" name="purpose" value="other">
                                            <span>その他</span>
                                        </label>
                                    </dd>
                                </dl>
                                <dl>
                                    <dt>
                                        <label for="message" class="flex-start">内　容</label>
                                    </dt>
                                    <dd>
                                        <textarea name="message" id="message" class="form-control form-textarea"
                                            placeholder="内容に関する詳細や備考等をご入力ください。"></textarea>
                                    </dd>
                                </dl>

                                <div class="c-button p-contact__submit-btn">
                                    <button type="submit">送 信</button>
                                </div>
                            </form>
                        </div><!--//p-contact__form -->
                    </div><!-- //p-contact__contents -->
                </div><!-- //inner -->
            </div>
            <!-- #endregion section contact -->



            <!-- #region fixed-buttons -->
            <div class="c-fixed-buttons">
                <div class="c-fixed-buttons__inner">
                    <button class="c-page-top">
                        <img src="./img/common/arrow-top.svg" alt="ページの先頭へ戻る">
                    </button>
                    <div class="c-button c-fixed-buttons__contact">
                        <a href="./contact-form.html">お問い合わせ</a>
                    </div>
                </div>
            </div>
            <!-- #endregion fixed-buttons -->

        </main>



        <!-- #region footer -->
        <footer class="l-footer p-footer section-bg">
            <div class="c-inner">
                <div class="p-footer__contents">
                    <nav class="p-footer__nav">
                        <ul>
                            <li>
                                <a href="./index.html">ホーム</a>
                            </li>
                            <li>
                                <a href="./plan.html">料金</a>
                            </li>
                            <li>
                                <a href="./blog-list.html">ブログ</a>
                            </li>
                            <li>
                                <a href="./result-list.html">卒業実績</a>
                            </li>
                        </ul>
                    </nav>
                    <a href="./index.html" class="p-footer__logo">
                        <img src="./img/common/logo-white.svg" alt="きたむらミュージックスクール">
                    </a>
                    <div class="p-footer__copyright">
                        <small>Copyright © 0000 KITAMURA music school Inc. <br class="sp">All Rights</small>
                    </div>
                    <ul class="p-footer__sns">
                        <li>
                            <a href="#">
                                <span><img src="./img/common/icon-twitter.svg" alt="x"></span></a>
                        </li>
                        <li>
                            <a href="#">
                                <span><img src="./img/common/icon-facebook.svg" alt="facebook"></span></a>
                        </li>
                        <li>
                            <a href="#">
                                <span><img src="./img/common/icon-youtube.svg" alt="youtube"></span></a>
                        </li>
                        <li>
                            <a href="#">
                                <span><img src="./img/common/icon-instagram.svg" alt="instagram"></span></a>
                        </li>
                    </ul>
                </div>
            </div>
        </footer>
        <!-- #endregion footer -->

    </div>
    <!--スライド-->
    <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
    <!--ハンバーガー-->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="./js/main.js?v=400"></script>
</body>

</html>
