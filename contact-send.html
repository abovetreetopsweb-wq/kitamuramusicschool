これはお問い合わせ送信完了ページですね。お問い合わせフォームと同じ p-contact に無理に入れず、私は分けます。

ページ全体：
メッセージ部分：
「ホームへ戻る」：p-contact-thanks__button

共通部分はそのまま、

上の画像付きタイトル：c-page-header
パンくず：c-breadcrumb
ボタンの基本デザイン：c-button
ヘッダー：l-header
フッター：l-footer

でOK。

このページはかなり単純なので、p-contact-thanks 系は3つ程度で十分だと思います。

ちなみに404ページと構造がかなり似ていますが、p-error と p-contact-thanks は意味が違うので、Projectとしては分けておく方が後から見て分かりやすいです。
